name: Bug report
description: Report a problem with VaultOS
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the issue
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Device model

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: iOS 18.6.2

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - SideStore
        - AltStore
        - Feather
        - TrollStore
        - LiveContainer
        - Other

  - type: input
    id: version
    attributes:
      label: VaultOS version
      placeholder: 1.0 (109), shown on the INFO page

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Fallout
        - Fallout 2
        - The launcher itself
        - Both games

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do just before it went wrong?

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      placeholder: Paste screenshots or logs here
