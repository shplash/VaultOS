name: Bug report
description: Report a problem with VaultOS
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the issue
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Device model

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: iOS 18.6.2

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - SideStore
        - AltStore
        - Feather
        - TrollStore
        - LiveContainer
        - Other

  - type: input
    id: version
    attributes:
      label: VaultOS version
      placeholder: 1.0 (109), shown on the INFO page

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Fallout
        - Fallout 2
        - The launcher itself
        - Both games

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do just before it went wrong?

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?

  - type: markdown
    attributes:
      value: |
        **Logs** live in the app's own folder: in the Files app, *On My iPhone
        → VaultOS → VaultOS*. `vaultos-launcher.log` covers the launcher,
        `fallout1-log.txt` and `fallout2-log.txt` the two engines' start-up,
        and `fallout1-saves.log` and `fallout2-saves.log` anything a save or a
        save picture went wrong on.

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      placeholder: Paste screenshots or logs here
