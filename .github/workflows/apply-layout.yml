name: Apply layout patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/P7b2J -o /tmp/layout.patch
          git apply --index /tmp/layout.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "shplash"
          git config user.email "192976206+shplash@users.noreply.github.com"
          git commit -m "Fix control size helper call after layout update"
          git push origin HEAD:main
