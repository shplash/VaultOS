name: Apply iOS movie and cursor labels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply patches/ios-movie-label.patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/int/movie.cc os/ios/launcher/LauncherBridge.mm os/ios/launcher/LauncherHost.swift src/launcher/launcher.h
          git commit -m "Scale cutscenes and label cursor modes"
          git push origin HEAD:main
