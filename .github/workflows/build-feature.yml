name: Build feature IPA

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned feature IPA
    runs-on: macos-15-intel
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore CMake build tree
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: ios-cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'third_party/**') }}
          restore-keys: |
            ios-cmake-${{ runner.os }}-

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version

      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build -G Xcode \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D PLATFORM=OS64 \
            -D DEPLOYMENT_TARGET=14.0 \
            -D ENABLE_BITCODE=0 \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Save configured build tree
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ios-cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'third_party/**') }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 3

      - name: Package IPA
        run: |
          set -euo pipefail
          cd build
          cpack -C RelWithDebInfo
          test -f fallout-ce.ipa
          cd ..
          cp build/fallout-ce.ipa fallout-ce-ios-unsigned.ipa
          unzip -l fallout-ce-ios-unsigned.ipa > ipa-contents.txt
          sed -n '1,20p' ipa-contents.txt

      - name: Verify IPA contents
        run: bash .github/scripts/verify-ipa.sh fallout-ce-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-ios-feature
          path: fallout-ce-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Launcher validation tests
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run launcher tests
        run: |
          set -euo pipefail
          mkdir -p build-tests
          # The launcher core is portable C++ and needs no SDL or engine code,
          # so it can be tested natively instead of through the iOS build.
          c++ -std=c++17 -Wall -Wextra -I src \
            tests/launcher_validation_test.cc \
            src/launcher/launcher_core.cc \
            -lz \
            -o build-tests/launcher-tests
          ./build-tests/launcher-tests

