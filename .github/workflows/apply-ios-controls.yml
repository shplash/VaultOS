name: Apply iOS controls fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patches
        run: |
          set -euo pipefail
          for patch in patches/ios-controls-*.patch; do
            echo "Applying $patch"
            git apply "$patch"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/ios/launcher/LauncherBridge.mm os/ios/launcher/LauncherHost.swift src/launcher/launcher.h src/plib/gnw/mouse.cc src/plib/gnw/mouse.h
          git commit -m "Use a trackpad cursor and one-shot loot button"
          git push origin HEAD:main
