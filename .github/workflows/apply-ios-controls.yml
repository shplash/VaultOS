name: Apply iOS controls patch

on:
  workflow_dispatch:
    inputs:
      patch_url:
        description: URL of the plain-text patch
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH_URL: ${{ inputs.patch_url }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 "$PATCH_URL" -o /tmp/controls.patch
          git apply --check /tmp/controls.patch
          git apply /tmp/controls.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/ios/launcher/LauncherBridge.mm os/ios/launcher/LauncherHost.swift os/ios/launcher/LauncherModel.swift os/ios/launcher/LauncherView.swift src/int/movie.cc src/launcher/launcher.h src/plib/gnw/mouse.cc src/plib/gnw/mouse.h
          git commit -m "Fix cutscene scaling and add iOS control tools"
          git push
