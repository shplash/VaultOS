name: Apply swap control patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/CG3KM -o /tmp/swap.patch
          git apply --index /tmp/swap.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "shplash"
          git config user.email "192976206+shplash@users.noreply.github.com"
          git commit -m "Add SWAP control and enlarge the action button"
          git push origin HEAD:main
