name: Release

on:
  release:
    types:
      - published

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: iOS

    runs-on: ${{ vars.VAULTOS_MACOS_RUNNER || 'macos-15-intel' }}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Same pin as the CI build: a release must be made with the toolchain
          # the tested build uses, not whatever the runner defaults to.
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: vaultos-ios-cmake-release-v1

      - name: Configure
        run: |
          set -euo pipefail
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D PLATFORM=OS64 \
            -D DEPLOYMENT_TARGET=14.0 \
            -D ENABLE_BITCODE=0 \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -D VAULTOS_BUILD_SHA=${{ github.sha }} \
            -D VAULTOS_BUILD=${{ github.run_number }} \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 3

      - name: Pack
        run: |
          set -euo pipefail
          cd build
          cpack -C RelWithDebInfo
          test -f vaultos.ipa
          cd ..
          unzip -l build/vaultos.ipa > ipa-contents.txt
          sed -n '1,20p' ipa-contents.txt

      - name: Verify IPA contents
        run: bash .github/scripts/verify-ipa.sh build/vaultos.ipa

      - name: Upload
        run: |
          set -euo pipefail
          cp build/vaultos.ipa VaultOS.ipa
          gh release upload "${{ github.event.release.tag_name }}" VaultOS.ipa
          rm VaultOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
