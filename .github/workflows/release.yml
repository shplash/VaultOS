name: Release

on:
  release:
    types:
      - published

defaults:
  run:
    shell: bash

# Uploading the IPA to the release needs a write token. The build workflow asks
# for the same permission explicitly; without it here the upload is refused
# wherever the repository's default token is read-only.
permissions:
  contents: write

jobs:
  # The host tests the CI build runs. A release is a build like any other: what
  # ships has to be what those tests passed, and the release must not be the one
  # binary that was never checked.
  tests:
    name: Host tests

    runs-on: ${{ vars.VAULTOS_MACOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 15

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build and run host tests
        run: bash .github/scripts/run-tests.sh

  ios:
    name: iOS
    needs: tests

    runs-on: ${{ vars.VAULTOS_MACOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 150

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Same pin as the CI build: a release must be made with the toolchain
          # the tested build uses, not whatever the runner defaults to.
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Restore CMake build tree
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          # Keyed the way the CI build keys its tree. The old fixed key restored
          # whatever had been saved first, so every later release built on top of
          # a tree from a different commit - and configured for it.
          path: build
          key: ios-cmake-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'third_party/**') }}
          restore-keys: |
            ios-cmake-release-${{ runner.os }}-

      - name: Configure
        env:
          # Through the environment rather than written into the command: a tag
          # is free text, and one holding a quote or a backtick would otherwise
          # be run as shell.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D PLATFORM=OS64 \
            -D DEPLOYMENT_TARGET=14.0 \
            -D ENABLE_BITCODE=0 \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -D VAULTOS_BUILD_SHA=${{ github.sha }} \
            -D VAULTOS_BUILD=${{ github.run_number }} \
            -D VAULTOS_VERSION="$RELEASE_TAG" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Save configured build tree
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ios-cmake-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'third_party/**') }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 3

      - name: Pack
        run: |
          set -euo pipefail
          cd build
          cpack -C RelWithDebInfo
          test -f vaultos.ipa
          cd ..
          unzip -l build/vaultos.ipa > ipa-contents.txt
          sed -n '1,20p' ipa-contents.txt

      - name: Verify IPA contents
        run: bash .github/scripts/verify-ipa.sh build/vaultos.ipa

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cp build/vaultos.ipa VaultOS.ipa
          gh release upload "$RELEASE_TAG" VaultOS.ipa
          rm VaultOS.ipa
