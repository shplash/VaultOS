name: Apply layout nudge patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/7kF1v -o /tmp/nudge.patch
          git apply --index /tmp/nudge.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "shplash"
          git config user.email "192976206+shplash@users.noreply.github.com"
          git commit -m "Nudge the touch controls and reorder the HUD row"
          git push origin HEAD:main
