name: Apply launcher patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and push
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "https://paste.rs/1vJZU" -o /tmp/launcher.patch
          test "$(sha256sum /tmp/launcher.patch | cut -d' ' -f1)" = "e9519bd6e2c8d943c0ac4fe8ba92191c2d60d046ab1b0581c9e525b6f989fc6f"
          git config user.name "Freebuff"
          git config user.email "noreply@codebuff.com"
          git am /tmp/launcher.patch
          git push origin HEAD:main
