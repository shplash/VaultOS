name: Apply launcher patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and push
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "https://paste.rs/4AJ1i" -o /tmp/launcher.patch
          test "$(sha256sum /tmp/launcher.patch | cut -d' ' -f1)" = "d4d3e6d30234daa6cb6a3d37c7878a70eeb9ecb87be6657faf8cf91373974926"
          git config user.name "Freebuff"
          git config user.email "noreply@codebuff.com"
          git am /tmp/launcher.patch
          git rm .github/workflows/apply-launcher.yml
          git commit -m "Remove the temporary patch workflow"
          git push origin HEAD:main

      - name: Start the IPA build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run build.yml --ref main; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Launcher changes were pushed, but the IPA workflow could not be started automatically."
