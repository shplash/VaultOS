name: Fix launcher source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch launcher source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("os/ios/launcher/LauncherView.swift")
          source = path.read_text()
          source = source.replace("IMPORT GAME ZIP\x08", 'IMPORT GAME ZIP"')
          old = '''            .font(.system(size: 12, weight: .bold, design: .monospaced))
            .kerning(1)
            .foregroundColor(filled'''
          new = '''            .font(.system(size: 12, weight: .bold, design: .monospaced))
            .foregroundColor(filled'''
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/ios/launcher/LauncherView.swift
          git commit -m "Fix launcher source encoding and button style"
          git push