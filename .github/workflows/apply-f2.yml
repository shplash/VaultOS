name: Apply Fallout 2 launcher changes

on:
  push:
    branches:
      - feature/fallout2-support

permissions:
  contents: write

jobs:
  apply:
    name: Apply prepared patch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          base64 -d f2.patch.gz.b64 > f2.patch.gz
          gzip -d f2.patch.gz
          git apply --check f2-changes.patch
          git apply f2-changes.patch
          rm f2-changes.patch f2.patch.gz.b64 .github/workflows/apply-f2.yml

          git config user.name "Freebuff"
          git config user.email "noreply@codebuff.com"
          git add -A
          git commit -m "Fix intro input handoff and add Fallout 2 launcher support"
          git push
