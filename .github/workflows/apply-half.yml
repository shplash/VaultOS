name: Apply half layout

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Gzipped base64 patch
        required: true

permissions:
  contents: write

concurrency:
  group: apply-half-layout
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apply:
    name: Apply and build
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply layout patch
        env:
          PAYLOAD: ${ { github.event.inputs.payload } }
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" | base64 -D | gunzip > /tmp/half-layout.patch
          git apply --context=3 --whitespace=now /tmp/half-layout.patch

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version 2>&1 | tee /tmp/xcode.txt
          cmake --version

      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build -G Xcode \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D PLATFORM=OS64 \
            -D DEPLOYMENT_TARGET=14.0 \
            -D ENABLE_BITCODE=0 \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -D CMAKE_XDCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 3

      - name: Package IPA
        run: |
          set -euo pipefail
          cd build
          cpack -C RelWithDebInfo
          test -f fallout-ce.ipa
          cd ..
          cp build/fallout-ce.ipa fallout-ce-ios-unsigned.ipa
          unzip -l fallout-ce-ios-unsigned.ipa | sed -n '1,20p'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-ipa
          path: fallout-ce-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Update release asset
        env:
          GH_TOKEN: $% {% { github.token } % }% 
        run: |
          set -euo pipefail
          gh release upload "${{}...}" 2>/dev/null || true
          echo 'DONE'
