name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore CMake build tree
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          # CMake's configure pass dominates a cold build (SDL feature
          # detection alone takes several minutes). Keeping the generated
          # Xcode project and SDL build tree lets source-only changes resume
          # with an incremental build instead of repeating it.
          path: build
          key: ios-cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'third_party/**') }}
          restore-keys: |
            ios-cmake-${{ runner.os }}-

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The macos-15-intel image ships Xcode 16.4; pin it so a runner
          # default change cannot silently change the Swift/iOS toolchain.
          # CMAKE_POLICY_VERSION_MINIMUM keeps SDL 2.26's old CMake minimum
          # working under CMake 4.x.
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version

      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build -G Xcode \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D PLATFORM=OS64 \
            -D DEPLOYMENT_TARGET=14.0 \
            -D ENABLE_BITCODE=0 \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Save configured build tree
        # Save as soon as configure succeeds. If the compile step later fails,
        # the next run still starts with a warm CMake/SDL configure.
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ios-cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'third_party/**') }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 3

      - name: Package IPA
        run: |
          set -euo pipefail
          cd build
          cpack -C RelWithDebInfo
          test -f vaultos.ipa
          cd ..
          cp build/vaultos.ipa vaultos-ios-unsigned.ipa
          unzip -l vaultos-ios-unsigned.ipa > ipa-contents.txt
          sed -n '1,20p' ipa-contents.txt

      - name: Verify IPA contents
        run: bash .github/scripts/verify-ipa.sh vaultos-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vaultos-ios-unsigned
          path: vaultos-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish draft build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="private-builds"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" vaultos-ios-unsigned.ipa --clobber
          else
            gh release create "$TAG" vaultos-ios-unsigned.ipa \
              --draft \
              --title "Private Builds" \
              --notes "Unsigned development build. Not for public distribution." \
              --target "${{ github.sha }}"
          fi

      - name: Summary
        run: |
          {
            echo "### VaultOS iOS IPA"
            echo ""
            echo "Unsigned IPA built from ${{ github.sha }} on the macos-15-intel runner."
            echo "Install it with AltStore or Sideloadly, which sign it with your own Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Launcher validation tests
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run launcher tests
        run: |
          set -euo pipefail
          mkdir -p build-tests
          # The launcher core is portable C++ and needs no SDL or engine code,
          # so it can be tested natively instead of through the iOS build.
          c++ -std=c++17 -Wall -Wextra -I src \
            tests/launcher_validation_test.cc \
            src/launcher/launcher_core.cc \
            -lz \
            -o build-tests/launcher-tests
          ./build-tests/launcher-tests

