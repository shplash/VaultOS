name: Apply white controls patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/ufmv5 -o /tmp/white.patch
          git apply --index /tmp/white.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "shplash"
          git config user.email "192976206+shplash@users.noreply.github.com"
          git commit -m "Add white controls toggle to the launcher"
          git push origin HEAD:main
