name: Fix MVE motion offsets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct getOffset return type
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/movie_lib.cc')
          text = path.read_text()
          old_decl = 'static uint8_t getOffset(uint16_t v);'
          new_decl = 'static int getOffset(uint16_t v);'
          old_def = 'uint8_t getOffset(uint16_t v)\n{'
          new_def = 'int getOffset(uint16_t v)\n{'

          if old_decl not in text and new_decl not in text:
              raise SystemExit('declaration not found')
          if old_def not in text and new_def not in text:
              raise SystemExit('definition not found')

          text = text.replace(old_decl, new_decl).replace(old_def, new_def)
          path.write_text(text)
          PY

          if git diff --quiet; then
            echo "Already fixed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/movie_lib.cc
          git commit -m "Fix MVE motion offset truncation"
          git push origin HEAD:main
