name: Apply iOS layout patch

on:
  workflow_dispatch:
    inputs:
      patch_url:
        description: URL of the plain-text patch
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH_URL: ${{ inputs.patch_url }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 "$PATCH_URL" -o /tmp/layout.patch
          git apply --check /tmp/layout.patch
          git apply /tmp/layout.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/ios/launcher/LauncherView.swift
          git commit -m "Make the launcher options scrollable"
          git push
