name: Apply controls patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/ndmDC -o /tmp/controls.patch
          git apply --index /tmp/controls.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "shplash"
          git config user.email "192976206+shplash@users.noreply.github.com"
          git commit -m "Rework touch controls and add launcher layout editor"
          git push origin HEAD:main
